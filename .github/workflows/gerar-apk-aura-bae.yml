name: Gerar APK Aura Bae

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/gerar-apk-aura-bae.yml"

permissions:
  contents: write

jobs:
  apk:
    name: Compilar aplicativo Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK de teste
        run: gradle -p android-app --no-daemon assembleDebug

      - name: Preparar download
        run: |
          mkdir -p dist
          cp android-app/app/build/outputs/apk/debug/app-debug.apk dist/Aura-Bae.apk
          sha256sum dist/Aura-Bae.apk > dist/Aura-Bae.sha256

      - name: Guardar artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Bae-APK
          path: dist/*
          retention-days: 30

      - name: Atualizar download permanente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view aplicativo-aura-bae >/dev/null 2>&1; then
            gh release upload aplicativo-aura-bae dist/Aura-Bae.apk dist/Aura-Bae.sha256 --clobber
            gh release edit aplicativo-aura-bae --latest
          else
            gh release create aplicativo-aura-bae dist/Aura-Bae.apk dist/Aura-Bae.sha256 \
              --title "Aura Bae para Android" \
              --notes "APK de teste do Aura Bae para passageiros e motoristas." \
              --latest
          fi
