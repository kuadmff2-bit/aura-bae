plugins {
    id "com.android.application"
}

android {
    namespace "br.com.aurabae.app"
    compileSdk 35

    defaultConfig {
        applicationId "br.com.aurabae.app"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        buildConfigField "String", "AURA_BAE_URL", '"https://aura-bae.kuadmff2.workers.dev"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            applicationIdSuffix ".teste"
            versionNameSuffix "-teste"
        }
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.core:core:1.15.0"
}
